# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

LAYERSERIES_COMPAT_pegasus = "scarthgap"

BBFILE_COLLECTIONS += "pegasus"
BBFILE_PATTERN_pegasus := "^${LAYERDIR}/"
BBFILE_PRIORITY_pegaus = "23"

BBFILES_DYNAMIC += " \
    fsl-bsp-release:${LAYERDIR}/dynamic-layers/imx-layer/recipes-*/*/*.bb \
    fsl-bsp-release:${LAYERDIR}/dynamic-layers/imx-layer/recipes-*/*/*.bbappend \
    meta-synaptics:${LAYERDIR}/dynamic-layers/synaptics-layer/recipes-*/*/*.bb \
    meta-synaptics:${LAYERDIR}/dynamic-layers/synaptics-layer/recipes-*/*/*.bbappend \
"

# =========================================================================
# Pegasus Layer "Self-Destruct" Logic (Strictly isolated to sl2619 machine)
# =========================================================================

# 1. Grab BOARD from the environment IMMEDIATELY during layer parse.
# The ':=' is CRITICAL. It locks the snapshot into a static text string before background
PEGASUS_BOARD_VAL := "${@d.getVar('BB_ORIGENV', False).getVar('BOARD') if d.getVar('BB_ORIGENV', False) else ''}"

# 2. Lock the DISTRO_FEATURES addition into a static string immediately as well.
PEGASUS_EXTRA_FEATURES := "${@'pam virtualization xen jailhouse ofono' if d.getVar('PEGASUS_BOARD_VAL') == 'pegasus' else ''}"

# 3. ONLY for sl2619: Safely append the locked static string to DISTRO_FEATURES.
DISTRO_FEATURES:append:sl2619 = " ${PEGASUS_EXTRA_FEATURES}"

# 4. ONLY for sl2619: Mask the ENTIRE meta-pegasus layer if BOARD is not pegasus.
BBMASK:append:sl2619 = " ${@'' if d.getVar('PEGASUS_BOARD_VAL') == 'pegasus' else '.*/meta-pegasus/.*'}"
